name: PartouTeris Android debug
on:
  workflow_dispatch:
  push:
    branches:
      - "feature/lunar-four-fronts-*"
    paths-ignore:
      - "temp/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the polar engine
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PartouTeris-v0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish uncompressed temporary APK on working branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p temp
          cp app/build/outputs/apk/debug/app-debug.apk temp/PartouTeris-v0.1.0-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp/PartouTeris-v0.1.0-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: temporary installable PartouTeris debug APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
