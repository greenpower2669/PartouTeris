name: PartouTetris Android debug
on:
  workflow_dispatch:
  push:
    branches:
      - "feature/lunar-four-fronts-*"
    paths-ignore:
      - "temp/**"
      - "**/*.md"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the polar engine
        run: node --test tests/*.test.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using runner tools
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: PartouTetris-v0.1.6-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish uncompressed temporary APK on working branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir -p temp
          cp app/build/outputs/apk/debug/app-debug.apk temp/PartouTetris-v0.1.6-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add temp/PartouTetris-v0.1.6-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "build: temporary installable PartouTetris debug APK [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
